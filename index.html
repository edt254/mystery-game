<div id="title-screen">
  <h1>失踪的拾光者</h1>

        <button class="bar-btn" id="btn-mute" title="静音 (M)">音</button>
        <button class="bar-btn accent" id="btn-journal" title="推演板">笔记</button>

    </div>

<div id="intro" class="hidden">
  <div class="letter">
    <b>发件人：</b>linwan@wushanmail.cn<br>
    <b>主题：</b>请帮我<br>
    <b>时间：</b>2026-06-20 02:13<br><br>
    你好。<br>
    你可能不认识我。我叫林晚。<br>
    如果你收到这封信，说明我已经不在了——或者说，我藏起来了。<br>
    我的故事都在我留下的痕迹里：博客、论坛、还有那座旧网站的留言板。<br>

<script>
'use strict';

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
let toastTimer = null;
function toast(msg, ms) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2800);
}

/* ============ 存档 ============ */
const SAVE_KEY = 'mystery_save_v1';
function defaultSave() {
  return { chapter: 1, discovered: [], mislead: {}, flags: {}, ending: null, lastUrl: null };
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const d = JSON.parse(raw);
    if (d.chapter !== 1) return defaultSave();
    return Object.assign(defaultSave(), d);
  } catch (e) { return defaultSave(); }
}
let save = loadSave();
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
function flag(k, v) { save.flags[k] = v === undefined ? true : v; persist(); }
function has(k) { return !!save.flags[k]; }
function isDiscovered(id) { return save.discovered.includes(id); }
function discover(id, silent) {
  if (isDiscovered(id)) return false;
  const c = CLUES[id];
  if (!c) return false;
  save.discovered.push(id);
  persist();
  if (!silent) {
    playDiscover();
    toast('已记录新线索：「' + c.title + '」');
  }
  return true;
}
function markMislead(id, on) {
  if (on) save.mislead[id] = true;
  else delete save.mislead[id];
  persist();
  if (on) {
    const c = CLUES[id];
    if (c && c.type === 'key') toast('你把一条关键线索标记成了误导——请慎重。', 3200);
    if (c && c.type === 'super') toast('这条线索似乎不是误导……再想想？', 3200);
  }
}
function isMarked(id) { return !!save.mislead[id]; }

/* ============ 音频 ============ */
let AC = null, master = null, noiseBuf = null, muted = false, ambientOn = false, gameStarted = false;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.7;
    const comp = AC.createDynamicsCompressor();
    master.connect(comp);
    comp.connect(AC.destination);
    const len = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    startDrone();
    scheduleThunder();
  } catch (e) {}
}
function startDrone() {
  if (!AC || ambientOn) return;
  ambientOn = true;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 170;
  const g = AC.createGain();
  g.gain.value = 0.035;
  const lfo = AC.createOscillator();
  lfo.frequency.value = 0.06;
  const lg = AC.createGain();
  lg.gain.value = 0.012;
  lfo.connect(lg); lg.connect(g.gain);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(); lfo.start();
}
function scheduleThunder() {
  setTimeout(() => {
    if (gameStarted) playThunder();
    scheduleThunder();
  }, 18000 + Math.random() * 26000);
}
function playThunder() {
  if (!AC || !gameStarted) return;
  const t0 = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(130, t0);
  lp.frequency.exponentialRampToValueAtTime(55, t0 + 1.6);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.8);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t0, Math.random()); src.stop(t0 + 2);
}
function playTone(f, dur, vol, type, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator();
  o.type = type || 'sine';
  o.frequency.value = f;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function playTick() { playTone(240, 0.07, 0.05, 'triangle'); }
function playDiscover() {
  [660, 880, 1100].forEach((f, i) => playTone(f, 0.28, 0.05, 'sine', i * 0.07));
}
function playScare() {
  if (!AC) return;
  const t0 = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(1300, t0);
  bp.frequency.exponentialRampToValueAtTime(260, t0 + 0.55);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.48, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + 0.9);
  playTone(58, 0.9, 0.28, 'sawtooth');
}
function playGhostAudio() {
  if (!AC) return;
  const seq = [196, 185, 196, 174, 155, 147, 131, 123, 110];
  seq.forEach((f, i) => playTone(f, 0.8, 0.05 + i * 0.004, 'sine', i * 0.42));
  playTone(55, 4.2, 0.12, 'sine', 0.1);
}
function toggleMute() {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.7;
  const b = $('btn-mute');
  if (b) b.textContent = muted ? '静' : '音';
  toast(muted ? '已静音' : '声音已开启', 1200);
}

/* ============ 假浏览器 ============ */
const HOME_URL = 'xunsou.cn/';
let tabs = [];
let activeTab = null;
let tabSeq = 1;

function normalize(raw) {
  let u = String(raw || '').trim();
  u = u.replace(/^https?:\/\//i, '');
  u = u.replace(/#.*$/, '');
  const slash = u.indexOf('/');
  let host, path;
  if (slash < 0) { host = u; path = '/'; }
  else { host = u.slice(0, slash); path = u.slice(slash); }
  host = host.toLowerCase();
  if (!host) host = HOME_URL.split('/')[0];
  if (!path) path = '/';
  if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
  return { host, path };
}
function urlKey(u) {
  const p = normalize(u);
  return p.host + p.path;
}
function makeTab(url) {
  const key = urlKey(url);
  const tab = { id: tabSeq++, url: key, history: [key], idx: 0, title: '' };
  tabs.push(tab);
  activeTab = tab;
  return tab;
}
function navigate(raw) {
  const key = urlKey(raw);
  if (!activeTab) makeTab(key);
  else {
    const hist = activeTab.history.slice(0, activeTab.idx + 1);
    hist.push(key);
    activeTab.history = hist;
    activeTab.idx = hist.length - 1;
    activeTab.url = key;
  }
  save.lastUrl = key;
  persist();
  renderTabs();
  renderPage();
  playTick();
}
function goBack() {
  if (!activeTab || activeTab.idx <= 0) return;
  activeTab.idx--;
  activeTab.url = activeTab.history[activeTab.idx];
  renderTabs();
  renderPage();
}
function goFwd() {
  if (!activeTab || activeTab.idx >= activeTab.history.length - 1) return;
  activeTab.idx++;
  activeTab.url = activeTab.history[activeTab.idx];
  renderTabs();
  renderPage();
}
function switchTab(id) {
  const t = tabs.find(x => x.id === id);
  if (!t) return;
  activeTab = t;
  renderTabs();
  renderPage();
}
function closeTab(id) {
  const i = tabs.findIndex(x => x.id === id);
  if (i < 0) return;
  tabs.splice(i, 1);
  if (!tabs.length) makeTab(HOME_URL);
  if (activeTab && activeTab.id === id) activeTab = tabs[Math.min(i, tabs.length - 1)];
  renderTabs();
  renderPage();
}
function renderTabs() {
  const strip = $('tabstrip');
  strip.innerHTML = tabs.map(t => {
    const host = normalize(t.url).host;
    return `<div class="tab ${t.id === (activeTab && activeTab.id) ? 'active' : ''}" data-tab="${t.id}">
      <span class="tt">${esc(t.title || HOSTS[host] || '页面')}</span>
      <span class="tclose" data-tabclose="${t.id}">×</span>
    </div>`;
  }).join('');
}

function renderPage() {
  const t = activeTab;
  if (!t) return;
  const { host, path } = normalize(t.url);
  const cleanPath = path.split('?')[0] || '/';
  const q = path.includes('?') ? path.slice(path.indexOf('?') + 1) : '';
  const site = SITES[host];
  const page = site && site.pages[cleanPath] ? site.pages[cleanPath] : null;
  const vp = $('viewport');
  t.title = page ? page.title : (site ? '页面不存在' : '无法访问');
  $('addr').value = 'https://' + t.url;
  let denied = null;
  if (host === '2008.wushan.cn' && cleanPath === '/confidential/20080312' && !has('k2')) denied = '该页面需要案卷权限。先找到第二份笔录。';
  if (host === 'cloud.linwan.cn' && (cleanPath === '/files' || cleanPath.startsWith('/file/')) && !has('cloudOpen')) denied = '需要访问密码。';
  if (host === 'police.wushan.cn' && cleanPath.startsWith('/case/') && !has('archiveOpen')) denied = '需要档案查询权限。';
  if (host === 'mail.wushan.cn' && cleanPath === '/mail/thanks' && !has('draftsRead')) denied = '这封邮件还不存在。';
  if (denied) {
    vp.innerHTML = `<div class="site-404"><div style="font-size:44px">403</div><div>${esc(denied)}</div><div class="muted-note" style="margin-top:16px">你正在接近一个不存在的页面。</div></div>`;
  } else if (page) {
    vp.innerHTML = page.html ? page.html({ q }) : '';
    if (page.mount) page.mount(vp);
    const onl = vp.querySelector('[data-rand-online]');
    if (onl) onl.textContent = '在线：' + (14 + Math.floor(Math.random() * 18)) + ' 人';
  } else {

  if (host === 'yuxiang2026.net') enableGlitch(true);

}

/* ============ 结局判定 ============ */
function endingStats() {
  let key = 0, sup = 0, mRight = 0, mWrong = 0;
  for (const id of Object.keys(CLUES)) {
    if (!isDiscovered(id)) continue;
    if (CLUES[id].type === 'key') key++;
    if (CLUES[id].type === 'super') sup++;
  }
  for (const id of Object.keys(CLUES)) {
    if (!isMarked(id)) continue;
    if (CLUES[id].type === 'mislead') mRight++;
    else mWrong++;
  }
  return { key, sup, mRight, mWrong };
}
function canRain() {
  const s = endingStats();
  return s.key >= 4 && s.sup >= 4 && s.mRight >= 3 && s.mWrong === 0;
}
function computeEnding(choice) {
  const s = endingStats();
  if (choice === 'rain' && canRain()) return 'D';
  if (s.key >= 4) return choice === 'publish' ? 'A' : 'B';
  return 'C';
}
function showEnding(k) {
  save.ending = k;
  persist();
  closeJournal();
  hideLightbox();
  enableGlitch(false);
  const e = ENDINGS[k];
  $('ending').innerHTML = `<div class="ending-card">
    <h2>${esc(e.title)}</h2>${esc(e.body)}
    <div><span class="tag">${esc(e.tag)}</span></div>
    <button id="ending-restart">重新开始</button>
  </div>`;
  $('ending').classList.remove('hidden');
  $('ending-restart').onclick = () => { localStorage.removeItem(SAVE_KEY); location.reload(); };
}

/* ============ 事件 ============ */
document.addEventListener('click', e => {
  const navEl = e.target.closest('[data-nav]');
  if (navEl) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }
  const tabEl = e.target.closest('[data-tab]');
  if (tabEl) { switchTab(Number(tabEl.getAttribute('data-tab'))); return; }
  const closeEl = e.target.closest('[data-tabclose]');
  if (closeEl) { closeTab(Number(closeEl.getAttribute('data-tabclose'))); return; }
  const bar = e.target.closest('[data-bar]');
  if (bar) {
    const a = bar.getAttribute('data-bar');
    if (a === 'back') goBack();
    else if (a === 'fwd') goFwd();
    else if (a === 'home') navigate(HOME_URL);
    else if (a === 'source') openSource();
    return;
  }
  const act = e.target.closest('[data-action]');
  if (act) { e.preventDefault(); runAction(act); return; }
  const lb = e.target.closest('[data-lb]');
  if (lb) { hideLightbox(); return; }
  const jtab = e.target.closest('.jtab');
  if (jtab) { openJournal(jtab.getAttribute('data-jtab')); return; }
  const mark = e.target.closest('[data-mark]');
  if (mark) {
    const id = mark.getAttribute('data-mark');
    markMislead(id, !isMarked(id));
    renderJournal();
    return;
  }
  const endBtn = e.target.closest('[data-end]');
  if (endBtn) {
    if (!endBtn.disabled) showEnding(computeEnding(endBtn.getAttribute('data-end')));
    return;
  }
});
document.addEventListener('submit', e => {
