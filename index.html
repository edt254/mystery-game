<script>
'use strict';

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
let toastTimer = null;
function toast(msg, ms) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2800);
}

/* ============ 存档 ============ */
const SAVE_KEY = 'mystery_save_v1';
function defaultSave() {
  return { chapter: 1, discovered: [], mislead: {}, flags: {}, ending: null, lastUrl: null };
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const d = JSON.parse(raw);
    if (d.chapter !== 1) return defaultSave();
    return Object.assign(defaultSave(), d);
  } catch (e) { return defaultSave(); }
}
let save = loadSave();
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
function flag(k, v) { save.flags[k] = v === undefined ? true : v; persist(); }
function has(k) { return !!save.flags[k]; }
function isDiscovered(id) { return save.discovered.includes(id); }
function discover(id, silent) {
  if (isDiscovered(id)) return false;
  const c = CLUES[id];
  if (!c) return false;
  save.discovered.push(id);
  persist();
  if (!silent) {
    playDiscover();
    toast('已记录新线索：「' + c.title + '」');
  }
  return true;
}
function markMislead(id, on) {
  if (on) save.mislead[id] = true;
  else delete save.mislead[id];
  persist();
  if (on) {
    const c = CLUES[id];
    if (c && c.type === 'key') toast('你把一条关键线索标记成了误导——请慎重。', 3200);
    if (c && c.type === 'super') toast('这条线索似乎不是误导……再想想？', 3200);
  }
}
function isMarked(id) { return !!save.mislead[id]; }

/* ============ 音频 ============ */
let AC = null, master = null, noiseBuf = null, muted = false, ambientOn = false, gameStarted = false;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.7;
    const comp = AC.createDynamicsCompressor();
    master.connect(comp);
    comp.connect(AC.destination);
    const len = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    startDrone();
    scheduleThunder();
  } catch (e) {}
}
function startDrone() {
  if (!AC || ambientOn) return;
  ambientOn = true;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 170;
  const g = AC.createGain();
  g.gain.value = 0.035;
  const lfo = AC.createOscillator();
  lfo.frequency.value = 0.06;
  const lg = AC.createGain();
  lg.gain.value = 0.012;
  lfo.connect(lg); lg.connect(g.gain);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(); lfo.start();
}
function scheduleThunder() {
  setTimeout(() => {
    if (gameStarted) playThunder();
    scheduleThunder();
  }, 18000 + Math.random() * 26000);
}
function playThunder() {
  if (!AC || !gameStarted) return;
  const t0 = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(130, t0);
  lp.frequency.exponentialRampToValueAtTime(55, t0 + 1.6);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.8);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t0, Math.random()); src.stop(t0 + 2);
}
function playTone(f, dur, vol, type, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator();
  o.type = type || 'sine';
  o.frequency.value = f;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function playTick() { playTone(240, 0.07, 0.05, 'triangle'); }
function playDiscover() {
  [660, 880, 1100].forEach((f, i) => playTone(f, 0.28, 0.05, 'sine', i * 0.07));
}
function playScare() {
  if (!AC) return;
  const t0 = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(1300, t0);
  bp.frequency.exponentialRampToValueAtTime(260, t0 + 0.55);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.48, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + 0.9);
  playTone(58, 0.9, 0.28, 'sawtooth');
}
function playGhostAudio() {
  if (!AC) return;
  const seq = [196, 185, 196, 174, 155, 147, 131, 123, 110];
  seq.forEach((f, i) => playTone(f, 0.8, 0.05 + i * 0.004, 'sine', i * 0.42));
  playTone(55, 4.2, 0.12, 'sine', 0.1);
}
function toggleMute() {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.7;
  const b = $('btn-mute');
  if (b) b.textContent = muted ? '静' : '音';
  toast(muted ? '已静音' : '声音已开启', 1200);
}

/* ============ 假浏览器 ============ */
const HOME_URL = 'xunsou.cn/';
let tabs = [];
let activeTab = null;
let tabSeq = 1;

function normalize(raw) {
  let u = String(raw || '').trim();
  u = u.replace(/^https?:\/\//i, '');
  u = u.replace(/#.*$/, '');
  const slash = u.indexOf('/');
  let host, path;
  if (slash < 0) { host = u; path = '/'; }
  else { host = u.slice(0, slash); path = u.slice(slash); }
  host = host.toLowerCase();
  if (!host) host = HOME_URL.split('/')[0];
  if (!path) path = '/';
  if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
  return { host, path };
}
function urlKey(u) {
  const p = normalize(u);
  return p.host + p.path;
}
function makeTab(url) {
  const key = urlKey(url);
  const tab = { id: tabSeq++, url: key, history: [key], idx: 0, title: '' };
  tabs.push(tab);
  activeTab = tab;
  return tab;
}
function navigate(raw) {
  const key = urlKey(raw);
  if (!activeTab) makeTab(key);
  else {
    const hist = activeTab.history.slice(0, activeTab.idx + 1);
    hist.push(key);
    activeTab.history = hist;
    activeTab.idx = hist.length - 1;
    activeTab.url = key;
  }
  save.lastUrl = key;
  persist();
  renderTabs();
  renderPage();
  playTick();
}
function goBack() {
  if (!activeTab || activeTab.idx <= 0) return;
  activeTab.idx--;
  activeTab.url = activeTab.history[activeTab.idx];
  renderTabs();
  renderPage();
}
function goFwd() {
  if (!activeTab || activeTab.idx >= activeTab.history.length - 1) return;
  activeTab.idx++;
  activeTab.url = activeTab.history[activeTab.idx];
  renderTabs();
  renderPage();
}
function switchTab(id) {
  const t = tabs.find(x => x.id === id);
  if (!t) return;
  activeTab = t;
  renderTabs();
  renderPage();
}
function closeTab(id) {
  const i = tabs.findIndex(x => x.id === id);
  if (i < 0) return;
  tabs.splice(i, 1);
  if (!tabs.length) makeTab(HOME_URL);
  if (activeTab && activeTab.id === id) activeTab = tabs[Math.min(i, tabs.length - 1)];
  renderTabs();
  renderPage();
}
function renderTabs() {
  const strip = $('tabstrip');
  strip.innerHTML = tabs.map(t => {
    const host = normalize(t.url).host;
    return `<div class="tab ${t.id === (activeTab && activeTab.id) ? 'active' : ''}" data-tab="${t.id}">
      <span class="tt">${esc(t.title || HOSTS[host] || '页面')}</span>
      <span class="tclose" data-tabclose="${t.id}">×</span>
    </div>`;
  }).join('');
}

function renderPage() {
  const t = activeTab;
  if (!t) return;
  const { host, path } = normalize(t.url);
  const cleanPath = path.split('?')[0] || '/';
  const q = path.includes('?') ? path.slice(path.indexOf('?') + 1) : '';
  const site = SITES[host];
  const page = site && site.pages[cleanPath] ? site.pages[cleanPath] : null;
  const vp = $('viewport');
  t.title = page ? page.title : (site ? '页面不存在' : '无法访问');
  $('addr').value = 'https://' + t.url;
  let denied = null;
  if (host === '2008.wushan.cn' && cleanPath === '/confidential/20080312' && !has('k2')) denied = '该页面需要案卷权限。先找到第二份笔录。';
  if (host === 'cloud.linwan.cn' && (cleanPath === '/files' || cleanPath.startsWith('/file/')) && !has('cloudOpen')) denied = '需要访问密码。';
  if (host === 'police.wushan.cn' && cleanPath.startsWith('/case/') && !has('archiveOpen')) denied = '需要档案查询权限。';
  if (host === 'mail.wushan.cn' && cleanPath === '/mail/thanks' && !has('draftsRead')) denied = '这封邮件还不存在。';
  if (denied) {
    vp.innerHTML = `<div class="site-404"><div style="font-size:44px">403</div><div>${esc(denied)}</div><div class="muted-note" style="margin-top:16px">你正在接近一个不存在的页面。</div></div>`;
  } else if (page) {
    vp.innerHTML = page.html ? page.html({ q }) : '';
    if (page.mount) page.mount(vp);
    const onl = vp.querySelector('[data-rand-online]');
    if (onl) onl.textContent = '在线：' + (14 + Math.floor(Math.random() * 18)) + ' 人';
  } else {
    vp.innerHTML = render404(host, cleanPath);
  }
  if (host === 'yuxiang2026.net') enableGlitch(true);
  else enableGlitch(false);
  updateJournalBadge();
}

  if (!t) return head + `<div class="no-result">请输入关键词。</div></div>`;
  const lq = t.toLowerCase();

    return head + `<div class="no-result">找到 0 条结果。<br><br><span style="color:#999">有些东西不在搜索引擎里。</span></div></div>`;

  }

    return head + `<div style="margin-top:14px">${items}</div></div>`;
  }
  return head + `<div class="no-result">找到 0 条结果。换个关键词试试。</div></div>`;
}

let rainNodes = null, heartInterval = null;
function setRain(on) {
  if (!AC) return;
  if (on && !rainNodes) {
    const src = AC.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.6;
    const g = AC.createGain();
    g.gain.value = 0.04;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start();
    rainNodes = { src, g };
  } else if (!on && rainNodes) {
    try { rainNodes.src.stop(); } catch (e) {}
    rainNodes = null;
  }
}
function setHeartbeat(on) {
  if (on && !heartInterval) {
    heartInterval = setInterval(() => playHeartbeat(0.55), 1500);
  } else if (!on && heartInterval) {
    clearInterval(heartInterval);
    heartInterval = null;
  }
}

/* ============ 窗口管理 ============ */
function ensureWindow(app, title) {
  if (winState[app] && winState[app].el) return winState[app];
  const el = document.createElement('div');
  el.className = 'win app-win';
  el.setAttribute('data-app', app);
  el.id = 'win-' + app;
  const n = Object.keys(winState).length;
  el.style.left = (70 + n * 34) + 'px';
  el.style.top = (36 + n * 28) + 'px';
  el.style.width = (app === 'browser' ? 980 : 860) + 'px';
  el.style.height = (app === 'browser' ? 660 : 580) + 'px';
  el.innerHTML = `<div class="win-bar"><span class="win-ico">${APPS[app].icon}</span><span class="win-title">${esc(title)}</span><div class="win-ctrl"><button data-win="min" title="最小化">─</button><button data-win="max" title="最大化">□</button><button data-win="close" class="wclose" title="关闭">×</button></div></div><div class="win-body"></div>`;
  $('win-layer').appendChild(el);
  const body = el.querySelector('.win-body');
  if (app === 'browser') {
    const br = $('browser');
    if (br) body.appendChild(br);
  }
  if (app === 'email' || app === 'chat' || app === 'cloud') {
    const v = document.createElement('div');
    v.className = 'app-view';
    v.id = 'view-' + app;
    body.appendChild(v);
  }
  winState[app] = { app, el, open: true, minimized: false, max: false, ever: true };
  makeDraggable(el.querySelector('.win-bar'), el, app);
  return winState[app];
}
function makeDraggable(bar, win, app) {
  let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('.win-ctrl')) return;
    if (winState[app].max) return;
    drag = true;
    sx = e.clientX; sy = e.clientY;
    ox = win.offsetLeft; oy = win.offsetTop;
    try { bar.setPointerCapture(e.pointerId); } catch (err) {}
  });
  bar.addEventListener('pointermove', e => {
    if (!drag) return;
    win.style.left = (ox + e.clientX - sx) + 'px';
    win.style.top = (oy + e.clientY - sy) + 'px';
  });
  bar.addEventListener('pointerup', () => { drag = false; });
  bar.addEventListener('dblclick', () => toggleMax(app));
}
function focusApp(app) {
  const ws = winState[app];
  if (!ws || !ws.el) return;
  winZ++;
  ws.el.style.zIndex = winZ;
  document.querySelectorAll('.win').forEach(w => w.classList.remove('focus'));
  ws.el.classList.add('focus');
  updateTaskbar();
}
function closeApp(app) {
  const ws = winState[app];
  if (!ws || !ws.el) return;
  ws.open = false;
  ws.el.style.display = 'none';
  updateTaskbar();
}
function minimizeApp(app) {
  const ws = winState[app];
  if (!ws || !ws.el) return;
  ws.minimized = true;
  ws.el.classList.add('min');
  updateTaskbar();
}
function restoreApp(app) {
  const ws = winState[app];
  if (!ws || !ws.el) return;
  ws.minimized = false;
  ws.open = true;
  ws.el.classList.remove('min');
  ws.el.style.display = '';
  focusApp(app);
}
function toggleMax(app) {
  const ws = winState[app];
  if (!ws || !ws.el) return;
  if (ws.max) {
    ws.el.classList.remove('max');
    ws.el.style.left = ws._x + 'px';
    ws.el.style.top = ws._y + 'px';
    ws.el.style.width = ws._w + 'px';
    ws.el.style.height = ws._h + 'px';
    ws.max = false;
  } else {
    ws._x = ws.el.offsetLeft; ws._y = ws.el.offsetTop;
    ws._w = ws.el.offsetWidth; ws._h = ws.el.offsetHeight;
    ws.el.classList.add('max');
    ws.el.style.left = '0px';
    ws.el.style.top = '0px';
    ws.el.style.width = '100%';
    ws.el.style.height = '100%';
    ws.max = true;
  }
  focusApp(app);
}
function updateWinTitle(app, title) {
  const ws = winState[app];
  if (ws && ws.el) {
    const t = ws.el.querySelector('.win-title');
    if (t) t.textContent = title;
  }
}
function openApp(app) {
  if (app === 'browser') {
    if (!winState.browser) ensureWindow('browser', '浏览器');
    const ws = winState.browser;
    ws.open = true;
    ws.el.style.display = '';
    if (!activeTab) {
      makeTab(appNav.browserLast || APPS.browser.home);
    }
    renderTabs();
    renderPage();
    restoreApp('browser');
    updateTaskbar();
    return;
  }
  if (app === 'email' || app === 'chat' || app === 'cloud') {
    if (!winState[app]) ensureWindow(app, APPS[app].name);
    const ws = winState[app];
    ws.open = true;
    ws.el.style.display = '';
    renderAppView(app);
    restoreApp(app);
    updateTaskbar();
    return;
  }
  if (app === 'notes') {
    if (!winState.notes) {
      ensureWindow('notes', '笔记');
      const body = winState.notes.el.querySelector('.win-body');
      const j = $('journal');
      if (j && j.parentNode !== body) {
        j.classList.remove('hidden');

      }
    }
    const ws = winState.notes;
    ws.open = true;
    ws.el.style.display = '';
    renderJournal();
    restoreApp('notes');
    updateTaskbar();
    return;
  }
  if (app === 'settings') {
    if (!winState.settings) {
      ensureWindow('settings', '设置');
      const body = winState.settings.el.querySelector('.win-body');
      body.innerHTML = `<div class="app-view" style="background:#14161b;color:#cdd3dd;padding:26px">
        <h3 style="margin-bottom:14px;letter-spacing:.2em">设 置</h3>
        <p style="line-height:2.2">声音：<button class="btn red" id="set-mute">切换静音</button>（或按 M）</p>
        <p style="line-height:2.2">切换应用：Alt + 1~6</p>
        <p style="line-height:2.2">存档：自动保存在本机浏览器</p>
        <div class="muted-note" style="margin-top:28px">设置 · 雾山数据中心 · 2008-2026</div>
      </div>`;
      body.querySelector('#set-mute').onclick = toggleMute;
    }
    const ws = winState.settings;
    ws.open = true;
    ws.el.style.display = '';
    restoreApp('settings');
    updateTaskbar();
    return;
  }
}

  bar.addEventListener('pointermove', e => {
    if (!drag) return;
    win.style.left = (ox + e.clientX - sx) + 'px';

  });

  bar.addEventListener('dblclick', () => toggleMax(app));
}

function ensureWindow(app, title) {

  const el = document.createElement('div');
  el.className = 'win app-win';
  el.setAttribute('data-app', app);

    const bar = document.createElement('div');

    body.appendChild(bar);
    const v = document.createElement('div');
    v.className = 'app-view';
    v.id = 'view-' + app;

  }
  winState[app] = { app, el, open: true, minimized: false, max: false, ever: true };
  makeDraggable(el.querySelector('.win-bar'), el, app);
  if (!el.getAttribute('data-shifted')) {
    const cur = parseInt(el.style.left, 10) || 0;
    if (cur < 170) el.style.left = (cur + 130) + 'px';
    el.setAttribute('data-shifted', '1');
  }
  return winState[app];
}

});

  if (journalTab === 'clues') {
    const ids = Object.keys(CLUES).filter(id => isDiscovered(id));
    const typeName = { key: '<span class="clue-mark key">关键</span>', mislead: '<span class="clue-mark mislead">存疑</span>', super: '<span class="clue-mark super">异常</span>' };
    const typeLabel = { key: '关键线索', mislead: '可能为误导', super: '异常线索' };
    body.innerHTML = ids.length ? ids.map(id => {
      const c = CLUES[id];
      const on = isMarked(id);
      return `<div class="jclue">
        <div class="jt">${esc(c.title)} ${typeName[c.type] || ''}</div>
        <div class="jd">${esc(c.date)} · ${esc(typeLabel[c.type] || '')}</div>
        <div>${esc(c.text)}</div>
        <div style="margin-top:8px"><button class="mark-btn ${on ? 'on' : ''}" data-mark="${id}">${on ? '已标记为误导 ✓' : '标记为误导'}</button></div>
      </div>`;
    }).join('') : '<div class="muted-note" style="line-height:2">还没有发现线索。去各个网站看看，找到可疑的内容，线索会自动记录在这里。</div>';
  } else if (journalTab === 'people') {
    const list = Object.keys(PEOPLE).filter(k => PEOPLE[k].unlock.some(isDiscovered));
    body.innerHTML = list.length ? list.map(k => {
      const p = PEOPLE[k];
      return `<div class="jperson"><div class="pn">${esc(p.name)}</div><div class="pd">${esc(p.desc)}</div></div>`;
    }).join('') : '<div class="muted-note" style="line-height:2">还没有足够的信息拼出人物关系。</div>';
  } else if (journalTab === 'timeline') {
    const rows = save.discovered.map(id => CLUES[id]).filter(Boolean)
      .sort((a, b) => (a.date === '未知' ? '9999' : a.date).localeCompare(b.date === '未知' ? '9999' : b.date));
    body.innerHTML = rows.length ? rows.map(c => `<div class="jtime"><span class="dt">${esc(c.date)}</span><span>${esc(c.title)}</span></div>`).join('')
      : '<div class="muted-note" style="line-height:2">时间线会随着线索的发现自动整理。</div>';
  } else if (journalTab === 'final') {
    const s = endingStats();
    const rain = canRain();
    if (!has('finalUnlocked')) {
      body.innerHTML = `<div class="jfinal"><div class="big">关键线索 ${s.key}/5 · 异常线索 ${s.super}/5 · 已标记误导 ${s.mRight}/4</div>
        <div class="muted-note" style="line-height:2;margin-top:12px">先读完林晚写给你的那封信（邮箱收件箱），再来做最终抉择。</div></div>`;
    } else {
      body.innerHTML = `<div class="jfinal">
        <div class="big">关键线索 ${s.key}/5 · 异常线索 ${s.super}/5 · 已标记误导 ${s.mRight}/4</div>
        <div class="muted-note" style="line-height:1.8;margin:10px 0">结局取决于你掌握的线索与最终的选择。</div>
        <button data-end="publish">公开全部证据</button>
        <button data-end="destroy">销毁证据，让一切沉默</button>
        <button data-end="rain" ${rain ? '' : 'disabled'}>走进雨巷${rain ? '' : '（条件不足）'}</button>
      </div>`;
    }
  }
}

/* ============ 结局判定 ============ */
function endingStats() {
  let key = 0, sup = 0, mRight = 0, mWrong = 0;
  for (const id of Object.keys(CLUES)) {
    if (!isDiscovered(id)) continue;
    if (CLUES[id].type === 'key') key++;
    if (CLUES[id].type === 'super') sup++;
  }
  for (const id of Object.keys(CLUES)) {
    if (!isMarked(id)) continue;
    if (CLUES[id].type === 'mislead') mRight++;
    else mWrong++;
  }
  return { key, sup, mRight, mWrong };
}
function canRain() {
  const s = endingStats();
  return s.key >= 4 && s.sup >= 4 && s.mRight >= 3 && s.mWrong === 0;
}
function computeEnding(choice) {
  const s = endingStats();
  if (choice === 'rain' && canRain()) return 'D';
  if (s.key >= 4) return choice === 'publish' ? 'A' : 'B';
  return 'C';
}
function showEnding(k) {
  save.ending = k;
  persist();
  closeJournal();
  hideLightbox();
  enableGlitch(false);
  const e = ENDINGS[k];
  $('ending').innerHTML = `<div class="ending-card">
    <h2>${esc(e.title)}</h2>${esc(e.body)}
    <div><span class="tag">${esc(e.tag)}</span></div>
    <button id="ending-restart">重新开始</button>
  </div>`;
  $('ending').classList.remove('hidden');
  $('ending-restart').onclick = () => { localStorage.removeItem(SAVE_KEY); location.reload(); };
}

/* ============ 事件 ============ */
document.addEventListener('click', e => {
  const navEl = e.target.closest('[data-nav]');
  if (navEl) { e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }
  const tabEl = e.target.closest('[data-tab]');
  if (tabEl) { switchTab(Number(tabEl.getAttribute('data-tab'))); return; }
  const closeEl = e.target.closest('[data-tabclose]');
  if (closeEl) { closeTab(Number(closeEl.getAttribute('data-tabclose'))); return; }
  const bar = e.target.closest('[data-bar]');
  if (bar) {
    const a = bar.getAttribute('data-bar');
    if (a === 'back') goBack();
    else if (a === 'fwd') goFwd();
    else if (a === 'home') navigate(HOME_URL);
    else if (a === 'source') openSource();
    return;
  }
  const act = e.target.closest('[data-action]');
  if (act) { e.preventDefault(); runAction(act); return; }
  const lb = e.target.closest('[data-lb]');
  if (lb) { hideLightbox(); return; }
  const jtab = e.target.closest('.jtab');
  if (jtab) { openJournal(jtab.getAttribute('data-jtab')); return; }
  const mark = e.target.closest('[data-mark]');
  if (mark) {
    const id = mark.getAttribute('data-mark');
    markMislead(id, !isMarked(id));
    renderJournal();
    return;
  }
  const endBtn = e.target.closest('[data-end]');
  if (endBtn) {
    if (!endBtn.disabled) showEnding(computeEnding(endBtn.getAttribute('data-end')));
    return;
  }
});
document.addEventListener('submit', e => {
  const form = e.target;
  if (form.getAttribute && form.getAttribute('data-action') === 'search') {
    e.preventDefault();
    submitSearch(form);
  }
});
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'm') toggleMute();
  if (k === 'enter' && e.target && e.target.id === 'addr') navigate($('addr').value);
});

/* ============ 启动 ============ */
function startNew() {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  save = defaultSave();
  persist();
  $('title-screen').classList.add('hidden');
  $('intro').classList.remove('hidden');
}
function beginGame() {
  gameStarted = true;
  $('intro').classList.add('hidden');
  $('game').classList.remove('hidden');
  makeTab('mail.wushan.cn/inbox');
  renderTabs();
  renderPage();
  toast('你的收件箱里有一封未读邮件。');
}
function continueGame() {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  gameStarted = true;
  $('title-screen').classList.add('hidden');
  $('game').classList.remove('hidden');
  if (save.ending) { showEnding(save.ending); return; }
  makeTab(save.lastUrl || 'mail.wushan.cn/inbox');
  renderTabs();
  renderPage();
}

$('btn-start').onclick = startNew;
$('btn-continue').onclick = continueGame;
$('btn-intro').onclick = beginGame;
$('btn-mute').onclick = toggleMute;
$('btn-journal').onclick = () => openJournal();
$('journal-close').onclick = closeJournal;
$('sm-close').onclick = () => $('source-modal').classList.add('hidden');

if (save.discovered.length || save.flags.started) $('btn-continue').classList.remove('hidden');
console.log('%c你看到我了。 — 观雨者', 'color:#a11;font-size:14px');
updateJournalBadge();
</script>
</body>
</html>
